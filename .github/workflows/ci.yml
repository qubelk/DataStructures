name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: checkout repo
      uses: actions/checkout@v4

    - name: Setup GoogleTest
      uses: Bacondish2023/setup-googletest@v1.1.0

    - name: make test
      run: make
